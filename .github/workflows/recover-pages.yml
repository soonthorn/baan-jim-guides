name: Recover Pages deployment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale initial Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/soonthorn/baan-jim-manuals/pages/deployments/986e1d4c602043180f381e24cc555c657ffb2443/cancel
      - name: Request Pages build from current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/soonthorn/baan-jim-manuals/pages/builds
